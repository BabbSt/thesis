<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title class="title">Document</title>
    <link rel="stylesheet" href="./CSS/style.css" media="screen">
    <link rel="stylesheet" href="./CSS/tableOfContents.css" media="screen">
    <script src="JavaScript/currentTOC.js" charset="utf-8" defer></script>
    <script src="JavaScript/tableOfContents.js" charset="utf-8" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    
</head>
<body>
    <header>
        <h1 class="title">title</h1>
        <h2>Table of Contents</h2>
        <a href="./bookshelf.html" class="iconButton" id="bookshelfLink"><span aria-hidden="true" class="material-symbols-outlined">chevron_backward</span>Bookshelf</a>
    </header>
    <main>
        <button type="button" id="toggleMenu" popovertarget="menu" class="menuButton"><span class="material-symbols-outlined">more_horiz</span></button>
        <menu id="menu" popover>
            <li><button class="menuButton popoverButton">Edit Cover <span aria-hidden="true" class="material-symbols-outlined">book_2</span></button></li>
            <li><button class="menuButton popoverButton">Edit Content <span aria-hidden="true" class="material-symbols-outlined">edit_note</span></button></li>
            <li><button class="menuButton popoverButton" command="show-modal" commandfor="shareModal">Share <span aria-hidden="true" class="material-symbols-outlined">upload</span></button></li>
        </menu>
        <search id="container">
            <input type="search" placeholder="Search">
        </search>
        <dialog id="shareModal">
            <h3 class="title">title</h3>
            <fieldset id="accessSelect">
                <legend>Access</legend>
                <ul>
                    <li>
                        <label for="view">View</label>
                        <input type="radio" id="view" name="accessRadio" checked>
                    </li>
                    <li>
                        <label for="edit">Edit</label>
                        <input type="radio" id="edit" name="accessRadio">
                    </li>
                </ul>
            </fieldset>
            <div class="searchContainer show">
                <label for="searchContacts">Share with your contacts</label>
                <input type="text" id="searchContacts" name="searchContacts" placeholder="Enter email or contact name">
                <div id="results" class="hidden">
                </div>
            </div>
            <!--Ask if this is the best way to handle these, no use anchor-->
            <div class="recentContacts">
                <button type="button" class="account_btn">
                    <img aria-hidden="true" class="account_img" src="./Images/AIcon.png">
                    Anthony
                </button>
                <button type="button" class="account_btn" id="susan">
                    <img aria-hidden="true" class="account_img" src="./Images/SIcon.png">
                    Susan
                </button>
                <button type="button" class="account_btn">
                    <img aria-hidden="true" class="account_img" src="./Images/CIcon.png">
                    Carly
                </button>
            </div>
            <button type="button">Copy Link <span aria-hidden="true" class="material-symbols-outlined">link_2</span></button>
        </dialog>
        <dialog id="shareDetailsModal">
            <form>
                <h3 class="title">title</h3>
                <p>With</p>
                <img class="account_img" src="./Images/SIcon.png">
                <!--Does this need a semantic lable?-->
                <select id="accessSelect" name="access">
                    <option value="view">View</option>
                    <option value="edit">Edit</option>
                </select>
                <label for="shareMessage">Message</label>
                <textarea id="shareMessage" name="shareMessage"></textarea>
                <button type="button" id="submitShare">Share <span aria-hidden="true" class="material-symbols-outlined">send</span></button>
            </form> 
        </dialog>
        <dialog id="confirmShare">
            <img class="account_img" src="./Images/SIcon.png">
            <p>Susan</p>
            <p>can now edit</p>
            <p class="title">title</p>
            <button type="button" id="doneSharing">Done</button>
        </dialog>
    </main>
</body>
</html>
