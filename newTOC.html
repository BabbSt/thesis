<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Table of Contents</title>
    <link rel="stylesheet" href="./CSS/style.css" media="screen">
    <!--<script src="JavaScript/newTOC.js" charset="utf-8" defer></script>-->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
    <header>
        <h1>Easy Eats</h1>
    </header>
    <main>
        <h2>Table of Contents</h2>
        <button type="button" onclick="document.location='./bookshelf.html'">Cancel</button>
        <button type="button">Save</button>
        <button type="button" command="show-modal" commandfor="addSectionModal">Add Section</button>
        <button type="button" onclick="document.location='./newRecipe.html'">Add Recipe</button>

        <dialog id="addSectionModal">
            <h2>Add new section</h2>
            <form id="newSection" method="post">
                <p>
                <label for="sectionTitle">Section Title</label>
                <input type="text" id="sectionTitle" name="sectionTitle">
                </p>
                <p>
                <label for="sectionImg">Image (optional)</label>
                <input type="file" id="sectionImg" name="sectionImg" accept="image/jpeg, image/png, image/webp">
                </p>
                <button type="button" command="close" commandfor="addSectionModal">Cancel</button>
                <button type="submit" id="submitSection">Save</button>
            </form>
        </dialog>
    </main>
</body>
</html>
