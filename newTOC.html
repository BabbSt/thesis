<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Table of Contents</title>
    <link rel="stylesheet" href="./CSS/style.css" media="screen">
    <link rel="stylesheet" href="./CSS/newTOC.css" media="screen">
    <script src="JavaScript/newTOC.js" charset="utf-8" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
    <header>
        <div class="svCanButtons">
            <button type="button" class="invertedButton" onclick="document.location='./bookshelf.html'">Cancel</button>
            <button type="button" id="saveBtn">Save</button>
        </div>
        <h1 id="bookTitle">Easy Eats</h1>
        <h2>Table of Contents</h2>
    </header>
    <main>
        <div class="addButtons">
            <button type="button" class="iconButton" command="show-modal" commandfor="addSectionModal">Add Section <span aria-hidden="true" class="material-symbols-outlined">add</span></button>
            <button type="button" class="iconButton" id="addRecipeGlobal">Add Recipe <span aria-hidden="true" class="material-symbols-outlined">add</span></button>
        </div>
        <dialog id="addSectionModal">
            <h2>Add new section</h2>
            <form id="newSection" method="post">
                <p>
                <label for="sectionTitle">Section Title</label>
                <input type="text" id="sectionTitle" name="sectionTitle" required>
                </p>
                <p>
                <label for="sectionImg">Image (optional)</label>
                <input type="file" id="sectionImg" name="sectionImg" accept="image/jpeg, image/png, image/webp">
                </p>
                <div class="frmSubCan">
                    <button type="button" class="invertedButton" command="close" commandfor="addSectionModal">Cancel</button>
                    <button type="button" id="submitSection">Save</button>
                </div>
            </form>
        </dialog>
    </main>
</body>
</html>
